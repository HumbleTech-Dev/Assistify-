<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23466f">
<title>Assistify — Offline</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#f4f7fb;color:#0f172a}
main{max-width:480px;text-align:center;background:#fff;border-radius:24px;padding:32px;box-shadow:0 16px 48px rgba(15,23,42,.12)}
img{width:110px;height:110px;object-fit:contain;border-radius:24px}
h1{margin:20px 0 10px}p{color:#64748b;line-height:1.6}
button{border:0;border-radius:12px;padding:12px 18px;background:#23466f;color:#fff;font-weight:700}
</style>
</head>
<body><main>
<img src="icons/icon-192.png" alt="Assistify">
<h1>You’re offline</h1>
<p>Assistify is still available for cached content. Reconnect to load anything that has not been saved on this device.</p>
<button onclick="location.reload()">Try again</button>
</main></body></html>
